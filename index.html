<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Restaurants (OSM)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        #status { position: absolute; top: 10px; left: 50px; z-index: 1000; background: white; padding: 8px 15px; border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,0.3); }
        .restaurant-info { max-width: 250px; }
        .restaurant-info h4 { margin: 0 0 5px 0; color: #333; }
        .restaurant-info p { margin: 3px 0; font-size: 13px; color: #666; }
        .cuisine-tag { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 2px 6px; border-radius: 3px; font-size: 11px; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="status">Getting your location...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([0, 0], 2);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        const statusDiv = document.getElementById('status');

        // 1. Get user location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    map.setView([lat, lon], 15);
                    statusDiv.textContent = 'Searching for restaurants nearby...';
                    
                    // Add user location marker
                    L.circleMarker([lat, lon], {
                        radius: 8, fillColor: '#4285F4', color: '#fff', weight: 2, fillOpacity: 1
                    }).addTo(map).bindPopup('You are here');
                    
                    // 2. Query Overpass API for restaurants within 1km
                    fetchRestaurants(lat, lon, 1000);
                },
                (error) => {
                    statusDiv.textContent = 'Location failed: ' + error.message + '. Showing default view.';
                    map.setView([40.7128, -74.0060], 13); // Default New York
                }
            );
        } else {
            statusDiv.textContent = 'Browser does not support geolocation';
        }

        // 3. Query Overpass API
        function fetchRestaurants(lat, lon, radius) {
            // Overpass QL: query restaurants and fast_food
            const query = `
                [out:json][timeout:25];
                (
                  node["amenity"="restaurant"](around:${radius},${lat},${lon});
                  way["amenity"="restaurant"](around:${radius},${lat},${lon});
                  node["amenity"="fast_food"](around:${radius},${lat},${lon});
                  way["amenity"="fast_food"](around:${radius},${lat},${lon});
                );
                out body;
                >;
                out skel qt;
            `;
            
            const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    statusDiv.textContent = `Found ${data.elements.length} restaurants`;
                    displayRestaurants(data.elements, lat, lon);
                })
                .catch(error => {
                    statusDiv.textContent = 'Query failed: ' + error.message;
                    console.error(error);
                });
        }

        // 4. Display on map
        function displayRestaurants(elements, userLat, userLon) {
            elements.forEach(el => {
                // Overpass returns node and way, ways need center
                let lat, lon;
                if (el.type === 'node') {
                    lat = el.lat;
                    lon = el.lon;
                } else if (el.type === 'way' && el.center) {
                    lat = el.center.lat;
                    lon = el.center.lon;
                } else {
                    return; // Skip if no coordinates
                }

                const tags = el.tags || {};
                const name = tags.name || 'Unnamed Restaurant';
                const cuisine = tags.cuisine || '';
                const address = tags['addr:street'] 
                    ? `${tags['addr:housenumber'] || ''} ${tags['addr:street']}`.trim()
                    : 'Address not recorded';
                const phone = tags.phone || tags['contact:phone'] || '';
                const website = tags.website || tags['contact:website'] || '';
                const openingHours = tags.opening_hours || '';

                // Calculate distance (Haversine simplified)
                const dist = getDistance(userLat, userLon, lat, lon);

                // Build popup content
                let popupHtml = `<div class="restaurant-info">
                    <h4>${escapeHtml(name)}</h4>
                    <p>📏 ${dist.toFixed(0)} meters away</p>
                    <p>📍 ${escapeHtml(address)}</p>`;
                
                if (cuisine) popupHtml += `<span class="cuisine-tag">${escapeHtml(cuisine)}</span>`;
                if (phone) popupHtml += `<p>📞 ${escapeHtml(phone)}</p>`;
                if (openingHours) popupHtml += `<p>🕒 ${escapeHtml(openingHours)}</p>`;
                if (website) popupHtml += `<p><a href="${escapeHtml(website)}" target="_blank">Website</a></p>`;
                
                popupHtml += `</div>`;

                // Add marker
                L.marker([lat, lon])
                    .addTo(map)
                    .bindPopup(popupHtml);
            });
        }

        // Haversine distance (meters)
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
