<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Orderbook — Demo</title>
<style>
  :root{
    --bg:#0b0e11; --panel:#161a1e; --border:#2b3139;
    --green:#0ecb81; --red:#f6465d; --text:#eaecef; --muted:#848e9c;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  body{background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:16px}
  .wrap{width:100%;max-width:420px}
  .header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .title{font-size:20px;font-weight:700}
  .price{font-size:22px;font-weight:700;color:var(--green)}
  .sub{font-size:12px;color:var(--muted)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .row{display:grid;grid-template-columns:1.2fr 1fr 1fr;padding:6px 10px;font-size:12px;position:relative}
  .row.head{color:var(--muted);border-bottom:1px solid var(--border);font-size:11px}
  .row .bar{position:absolute;top:0;bottom:0;right:0;opacity:.12;border-radius:2px}
  .ask .bar{background:var(--red)}
  .bid .bar{background:var(--green)}
  .ask .p{color:var(--red)}
  .bid .p{color:var(--green)}
  .amt,.tot{text-align:right;color:var(--text)}
  .mid{padding:8px 10px;text-align:center;font-weight:700;font-size:16px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:#1e2329}
  .status{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="title">BTC/USDT</div>
      <div class="sub">Order Book · Demo</div>
    </div>
    <div class="price">$67,842.50</div>
  </div>

  <div class="panel">
    <div class="row head"><span>Price (USDT)</span><span class="amt">Amount (BTC)</span><span class="tot">Total</span></div>
    <div id="asks"></div>
    <div class="mid">Spread: 1.50</div>
    <div id="bids"></div>
  </div>
  <div class="status"><span class="dot"></span>Demo data — not live</div>
</div>

<script>
// ---------- DEMO DATA ----------
const demoAsks = [
  [67843.00, 0.0421],
  [67844.50, 0.1183],
  [67846.00, 0.2507],
  [67848.20, 0.0894],
  [67850.00, 0.6120],
  [67852.10, 0.0315],
  [67855.00, 0.4402],
  [67858.30, 0.2076],
];

const demoBids = [
  [67841.50, 0.0732],
  [67840.00, 0.1845],
  [67838.70, 0.3021],
  [67836.00, 0.0568],
  [67833.50, 0.5120],
  [67830.00, 0.0973],
  [67827.40, 0.3650],
  [67824.00, 0.2219],
];

const asksEl = document.getElementById('asks');
const bidsEl = document.getElementById('bids');

function fmt(n,d=2){return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}

function render(el, levels, side, maxTotal){
  el.innerHTML='';
  levels.forEach(([price, amt])=>{
    const total = price*amt;
    const row = document.createElement('div');
    row.className = 'row '+side;
    const pct = Math.min(100,(total/maxTotal)*100);
    row.innerHTML = `
      <span class="bar" style="width:${pct}%"></span>
      <span class="p">${fmt(price)}</span>
      <span class="amt">${Number(amt).toFixed(4)}</span>
      <span class="tot">${fmt(total,0)}</span>`;
    el.appendChild(row);
  });
}

const maxTotal = Math.max(
  ...demoAsks.map(([p,a])=>p*a),
  ...demoBids.map(([p,a])=>p*a)
);

render(asksEl, demoAsks, 'ask', maxTotal);
render(bidsEl, demoBids, 'bid', maxTotal);
</script>
</body>
  </html>
